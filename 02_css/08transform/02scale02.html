<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scale</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        ul{
            list-style: none;
            size-adjust: 640px;
            margin: 0 auto;
            display: flex;
             justify-content: space-between;
        }
        ul li{
            width: 200px;
            height: 150px;
            overflow: hidden;
            
           
        }
        ul li a{
            display: block;
            width: 100%; height: 100%;
            
        }
        ul li a img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .6s;
        }
        ul li:hover a img{
            transform: scale(1,2);
        }

    </style>
</head>
<body>
    <ul>
        <li><a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQ7unUKPnzMxRSJ72LIiKRkKGU6dDyJ2kMnP8tmhYMmg&s=10" alt="정재현"></a></li>
        <li><a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSztQ71ylnJwJDz4jlN22zqaQI9J62YqzTeIEo-3PBl-A&s=10" alt="정재현"></a></li>
        <li><a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYWIt4sxH_OpA2oegGBAu3a9MyheB3RcDj0Z1fi2c4Qg&s=10" alt="정재현"></a></li>
    </ul>
</body>
</html>
