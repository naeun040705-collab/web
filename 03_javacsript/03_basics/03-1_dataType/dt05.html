<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>undifined 데이터</title>
</head>
<body>
    <script>
        //undifined 데이터는 변수를 선언 하였으나 데이터 값을 지정하지 않았을 경우
        let temp;
        console.log(temp);

        //객체의 속성값을 지정하지 않았을 경우 자동으로 지정되는 값이다.
        let obj = {name:'박나은', age:23}
        obj.job = '디자이너';
        console.log(obj.name);
        console.log(obj.age);
        console.log(obj.job);
        console.log(obj.job2);
        
    </script>
</body>
</html>
