<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text 속성 연습</title>
    <style>
        h2{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-style: oblique;
            font-size: 50px;
            color: aqua;
            text-shadow: 4px 4px 0px black;
        }
       .s1{
        font-size: 40px;
        text-decoration: underline dashed green 3px;
       }
        
    </style>
</head>
<body>
    <h2>이것은 text 속성 연습입니다.</h2>
    <div >
        <h3>연습칸</h3>
        <p class="s1">1번 문장 first sentence</p>
        <p class="s2">2번 문장 second sentence</p>
        <p class="s3">3번 문장 third sentence</p>
        <p class="s4">4번 문장 fourth sentence</p>
        <p class="s5">5번 문장 fifth sentence</p>
    </div>
</body>
</html>
