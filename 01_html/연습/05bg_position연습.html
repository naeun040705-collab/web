<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05bg_position 연습용</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        div{
            margin: 100px;
            padding: 50px;
            border: 1px solid #222;
            width: 150px;
        }
        button{
            width: 100%;
            height: 50px;
            background-color: mediumaquamarine;
            border: 0;
            color: #fff;
            border-radius: 15px;
            font-weight: bold;
            line-height:1;
            font-size: 12px;
            background-image: url(../../02_css/03background/img/bookmark.png);
            background-repeat: no-repeat;
            box-sizing: border-box;
        }
        #bg1{
            background-position: 10px 9px;
        }
        #bg2{
            background-position: center;
            color: transparent;
        }
        .bg{
            width: 1000px;
            height: 500px;
            border: 3px solid #222;
            background-image: url(../../02_css/03background/img/1456.png);
            background-repeat: no-repeat;
        }
        .bg1{
            background-position: right;
        }
        .bg2{
            background-position: center;
        }
        .bg3{
            background-image: url(../../02_css/03background/img/check.png);
            background-position: -300px -300px;
        }
        .bg4{
            background-image: url(../../02_css/03background/img/check.png);
            background-position: right 300px top -310;
        }
    </style>
</head>

<body>
    <div><button type="button" id="bg1">bookmark</button></div>
    <div><button type="button" id="bg2">bookmark</button></div>
    <div class="bg bg1">text</div>
    <div class="bg bg2">text</div>
    <div class="bg bg3">text</div>
    <div class="bg bg4">text</div>
</body>

</html>
