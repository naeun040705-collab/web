<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .con {
            width: 300px;
            height: 300px;
            background-color: lawngreen;
            position: relative;
            margin: 400px auto;
        }

        .con .card {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            transition: .6s;
            transform-origin: top;
            transform-style: preserve-3d;

        }

        .con:hover .card {
            transform: rotateX(180deg);
        }

        .face {
            width: 100%;
            height: 100%;
            position: absolute;
        }

        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover;

        }

        .back {
            transform: rotateX(180deg);
            backface-visibility: hidden;
        }
    </style>
</head>

<body>
    <div class="con">
        <div class="card">
            <div class="face front"><img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSG7f9-39caWfTP3jx-JEy5ZSSeE8xtF2qRdoJMdmXC3A&s=10"
                    alt="정재현 앞면"></div>
            <div class="face back"><img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSi5p6H5uz7RxuCyAITVO1bw7ypICAkN9mKB9j3Hesa5Q&s"
                    alt="정재현 뒷면"></div>
        </div>
    </div>
</body>

</html>
