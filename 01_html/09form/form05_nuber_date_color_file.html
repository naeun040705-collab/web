<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>number range date color file</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>number range</legend>
            <ul>
                <li>
                    <label for="num">참여인원<small>(최대10명)</small></label>
                    <input type="number" id="num" value="1" min="0" max="10">
                </li>
                <li>
                    <label for="num2">지원물품<small>(1인당 5개)</small></label>
                    <input type="number" id="num2" value="0" min="0" max="50" step="5">
                </li>
                <li>
                    <label for="sat">희망단계<small>(하,중,상)</small></label>
                    <input type="range" id="sat" min="1" max="3" value="1">
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>date / month / week / time / datetime-local</legend>
            <ul>
                <li><label>날짜<input type="date" value="2026-10-20"></label></li>
                <li><label>월<input type="month" value="2026-10"></label></li>
                <li><label>주<input type="week" value="2026-W43"></label></li>
            </ul>
            <h2>시간 입력</h2>
            <ul>
                <li><label>시작시간<input type="time" value="09:00"></label></li>
                <li><label>종료시간<input type="time" value="17:50"></label>
                </li>
            </ul>
            
        </fieldset>
        <fieldset>
            <legend>color file</legend>
            <label>컬러 선택 : <input type="color" value="#77EBEF"></label>
            <label>파일 선택 : <input type="file"></label>
        </fieldset>
    </form>
</body>

</html>
